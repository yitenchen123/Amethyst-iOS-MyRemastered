name: Vendor MobileGL sources

# 一次性工具：把 MobileGL 及其子模块的源码 vendoring 进本仓库的
# Natives/external/MobileGL，之后和 MobileGlues 一样以普通源码目录管理，
# 可以直接改源码来调 iOS 构建，不再依赖上游 submodule 指针。
#
# 上游历史教训：用 submodule 管理 MobileGL 时，上游 force push 导致 pinned
# commit 消失，git submodule update 直接 exit 128，之后孤立 gitlink 被反复
# 引入，连着五个提交都在做清理（c7df0a32 / 4d744bad / 72ce0f3f / 7970c9fd /
# 052b3a09）。vendoring 成普通目录后不再受上游变动影响。
#
# 需要重跑时：Actions -> Vendor MobileGL sources -> Run workflow

on:
  workflow_dispatch:
    inputs:
      mg_ref:
        description: 'MobileGL ref to vendor (branch / tag / sha)'
        required: false
        default: 'dev'
      dry_run:
        description: 'true = only clone and report, do not commit'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  vendor:
    # Linux runner：只为 clone 与提交，不需要 Xcode，且比 macOS 便宜 10 倍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone MobileGL and required submodules
        env:
          MG_REF: ${{ github.event.inputs.mg_ref }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eu
          REF="${MG_REF:-dev}"
          echo "== MobileGL ref: $REF =="

          rm -rf Natives/external/MobileGL
          git clone --depth 1 --branch "$REF" \
            https://github.com/MobileGL-Dev/MobileGL.git Natives/external/MobileGL

          cd Natives/external/MobileGL
          echo "== main repo: $(du -sh . | cut -f1) / $(find . -type f -not -path './.git/*' | wc -l) files =="

          # CMakeLists.txt 里无条件 add_subdirectory 的子模块。
          # tracy 只在 MOBILEGL_ENABLE_TRACY 开启时需要，apitrace / asio 不参与 iOS 构建。
          echo "== fetching required submodules =="
          for m in 3rdparty/glslang \
                   3rdparty/SPIRV-Cross \
                   3rdparty/VulkanMemoryAllocator \
                   3rdparty/Vulkan-Headers \
                   3rdparty/SPIRV-Reflect \
                   3rdparty/xxHash \
                   include/ska; do
            git submodule update --init --depth 1 "$m" \
              || echo "::warning::submodule $m unavailable"
          done

          # Vulkan-Utility-Libraries 自带 Vulkan-Headers 子模块，必须 --recursive
          git submodule update --init --depth 1 --recursive 3rdparty/Vulkan-Utility-Libraries \
            || echo "::warning::Vulkan-Utility-Libraries unavailable"

          # DiligentCore 本身不参与编译（CMakeLists 里 add_subdirectory 已注释），
          # 只为 Makefile 的软链接提供 ThirdParty/SPIRV-Tools 与 SPIRV-Headers。
          echo "== fetching DiligentCore ThirdParty (SPIRV-Tools / SPIRV-Headers) =="
          git submodule update --init --depth 1 3rdparty/DiligentCore \
            || echo "::warning::DiligentCore unavailable"
          if [ -d 3rdparty/DiligentCore ]; then
            ( cd 3rdparty/DiligentCore \
                && git submodule update --init --depth 1 \
                     ThirdParty/SPIRV-Tools ThirdParty/SPIRV-Headers ) \
              || echo "::warning::DiligentCore ThirdParty submodules unavailable"
          fi

      - name: Strip nested git metadata
        run: |
          set -eu
          cd Natives/external/MobileGL
          # 删掉主仓库与所有子模块的 .git，使其成为普通源码目录。
          # 保留 .gitmodules 供后续更新源码时参考，但不再是 gitlink。
          find . -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name .git -type f -exec rm -f {} + 2>/dev/null || true
          echo "== git metadata stripped =="

      - name: Prune non-iOS bulk
        run: |
          set -eu
          cd Natives/external/MobileGL
          before=$(du -sk . | cut -f1)
          # 这些目录体量大且不参与 iOS 构建，删掉可显著降低仓库体积。
          for d in \
            3rdparty/SPIRV-Cross/test \
            3rdparty/SPIRV-Cross/reference \
            3rdparty/glslang/Test \
            3rdparty/glslang/gtests \
            3rdparty/Vulkan-Headers/tests \
            3rdparty/Vulkan-Utility-Libraries/tests \
            3rdparty/DiligentCore/Tests \
            3rdparty/DiligentCore/Samples \
            3rdparty/DiligentCore/Tutorials \
            tools/trace_replay/fixtures \
            android-plugin ; do
            if [ -d "$d" ]; then rm -rf "$d"; echo "  pruned: $d"; fi
          done
          after=$(du -sk . | cut -f1)
          echo "== size: ${before} KB -> ${after} KB (saved $((before-after)) KB) =="

      - name: Report
        run: |
          set -eu
          cd Natives/external/MobileGL
          echo "== vendored MobileGL =="
          echo "  files : $(find . -type f | wc -l)"
          echo "  size  : $(du -sh . | cut -f1)"
          echo
          echo "  必需子模块存在性检查："
          for d in 3rdparty/glslang \
                   3rdparty/SPIRV-Cross \
                   3rdparty/VulkanMemoryAllocator \
                   3rdparty/Vulkan-Headers \
                   3rdparty/Vulkan-Utility-Libraries \
                   3rdparty/SPIRV-Reflect \
                   3rdparty/xxHash \
                   3rdparty/DiligentCore/ThirdParty/SPIRV-Tools \
                   3rdparty/DiligentCore/ThirdParty/SPIRV-Headers \
                   include/ska \
                   MobileGL/MG_Util/Types.h \
                   MobileGL/MG_Backend/DirectVulkan ; do
            if [ -e "$d" ]; then echo "    [OK]      $d"; else echo "    [MISSING] $d"; fi
          done

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        env:
          MG_REF: ${{ github.event.inputs.mg_ref }}
        run: |
          set -eu
          git add -A Natives/external/MobileGL
          if git diff --cached --quiet; then
            echo "MobileGL sources unchanged; nothing to commit"
            exit 0
          fi
          SIZE=$(du -sh Natives/external/MobileGL | cut -f1)
          FILES=$(find Natives/external/MobileGL -type f | wc -l)
          git commit -q \
            -m "chore(mobilegl): vendor MobileGL sources (${SIZE}, ${FILES} files)" \
            -m "把 MobileGL 及其必需子模块的源码 vendoring 进 Natives/external/MobileGL，与 MobileGlues 一样作为普通源码目录管理。" \
            -m "上游以 submodule 接入时，上游 force push 会让 pinned commit 消失，git submodule update 直接 exit 128；之后孤立 gitlink 被反复引入，连着五个提交都在清理。vendoring 后不再受上游变动影响，且可以直接改源码来调 iOS 构建。" \
            -m "来源：MobileGL-Dev/MobileGL ref=${MG_REF}（子模块按各自默认分支取 --depth 1）" \
            -m "包含（CMakeLists.txt 中无条件 add_subdirectory 的）：glslang / SPIRV-Cross / VulkanMemoryAllocator / Vulkan-Headers / Vulkan-Utility-Libraries / SPIRV-Reflect / xxHash / include/ska。DiligentCore 不参与编译（add_subdirectory 已注释），只为 Makefile 的软链接提供 ThirdParty/SPIRV-Tools 与 SPIRV-Headers，故只取这两个子模块。tracy（默认 OFF）、apitrace、asio 不参与 iOS 构建，未纳入。" \
            -m "已剔除大体量且非必需目录以控制仓库体积（SPIRV-Cross/test、glslang/Test、Vulkan-Headers/tests、DiligentCore/Samples/Tutorials、trace_replay/fixtures、android-plugin 等）。所有嵌套 .git 已删除，该目录不再是 gitlink。" \
            -m "[skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          echo "pushed: $(git rev-parse HEAD)"
