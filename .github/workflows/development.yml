name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

# 并发控制：同一分支/PR 新的推送会取消仍在排队或运行的旧构建。
# 这能显著缓解 macos-14 runner 供应紧张导致的"一直卡在队列中"问题：
# 开发中频繁 push 时，旧构建被立即取消，runner 资源让给最新提交。
# workflow_dispatch 手动触发也纳入同一组，避免与自动触发互相堆积。
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-14

    # 发布 nightly release 需要 contents: write
    permissions:
      contents: write

    steps:
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version || true

      - name: Install GNU Make
        run: |
          brew update
          brew install make

      - name: Install Java 8 (Temurin) via Homebrew
        run: |
          brew install --cask temurin@8 || true

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Drop stale submodule gitlinks
        # 历史遗留：MobileGL 曾以 submodule 方式接入，上游 force push 导致 pinned
        # commit 消失、孤立 gitlink 被反复引入，当时靠这个步骤清理。
        # MobileGL 现在与 MobileGlues 一样是 vendored 源码目录（见
        # .github/workflows/vendor-mobilegl.yml），不再是 gitlink。
        # 因此这里只在 git ls-files -s 显示 mode 160000（确实是 gitlink）时才清理，
        # 避免把 vendored 的真实源码目录从索引里删掉。
        run: |
          for p in Natives/external/MobileGL Natives/external/MobileGlues; do
            mode=$(git ls-files -s -- "$p" 2>/dev/null | awk '{print $1}')
            if [ "$mode" = "160000" ]; then
              echo "dropping stale gitlink: $p"
              git rm --cached -f "$p" || true
              git config --remove-section "submodule.$p" 2>/dev/null || true
            else
              echo "$p is a regular path (mode=${mode:-none}), keeping"
            fi
          done

      - name: Checkout repository submodules
        env:
          # MobileGL 上游 LFS 配额已用尽，其 LFS 文件（tools/trace_replay/fixtures）
          # 与 iOS 构建无关，跳过 smudge 避免 submodule checkout 失败 exit 128
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git submodule update --init --recursive

      # 注意：不要在 `if:` 条件里引用 secrets / vars。
      # GitHub Actions 的表达式求值器在编译 workflow 时处理这些 context，
      # vars 在仓库尚未创建任何 variable 时求值也会失败，导致整个 workflow
      # 编译失败（表现为 run 直接 failure、jobs total_count=0、日志 404）。
      # 判断逻辑一律放进 shell，env: 里引用是安全的标准用法。
      #
      # Mithril 不需要下载步骤：libmithril.dylib 已提交在
      # Natives/resources/Frameworks/ 下，随 Natives/resources/* 一起打包。
      - name: Fetch MobileGL source (optional)
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          BUILD_MOBILEGL: ${{ vars.BUILD_MOBILEGL }}
        run: |
          set -eu
          if [ "${BUILD_MOBILEGL:-0}" != "1" ]; then
            echo "BUILD_MOBILEGL is not 1; skipping MobileGL source fetch"
            exit 0
          fi
          rm -rf Natives/external/MobileGL
          git clone --depth 1 https://github.com/MobileGL-Dev/MobileGL.git Natives/external/MobileGL
          cd Natives/external/MobileGL
          # MobileGL 的 CMakeLists 对下面这批是无条件 add_subdirectory()，缺任意一个
          # configure 就会失败。apitrace / tracy 不参与 iOS 构建，跳过。
          for m in 3rdparty/glslang \
                   3rdparty/SPIRV-Cross \
                   3rdparty/SPIRV-Reflect \
                   3rdparty/Vulkan-Headers \
                   3rdparty/VulkanMemoryAllocator \
                   3rdparty/xxHash \
                   3rdparty/asio \
                   include/ska; do
            git submodule update --init --depth 1 "$m" \
              || echo "::warning::MobileGL submodule $m unavailable"
          done
          # Vulkan-Utility-Libraries 自带 Vulkan-Headers 子模块，必须 --recursive
          git submodule update --init --depth 1 --recursive 3rdparty/Vulkan-Utility-Libraries \
            || echo "::warning::MobileGL submodule Vulkan-Utility-Libraries unavailable"
          # DiligentCore 本身不参与编译（CMakeLists 里 add_subdirectory 已注释），
          # 只为 Makefile 的软链接提供 ThirdParty/SPIRV-Tools 与 SPIRV-Headers。
          # 该仓库自身没有子模块，不需要 --recursive（省下大量 clone 时间）。
          git submodule update --init --depth 1 3rdparty/DiligentCore \
            || echo "::warning::MobileGL submodule DiligentCore unavailable"

      - name: Build for ${{ matrix.platform_name }}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 14.0
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
          # 供上面的 Fetch MobileGL source 与下面的 make 使用。
          # 在 env: 里引用 vars 是官方支持的用法；不要写成
          # `export BUILD_MOBILEGL=${{ vars.BUILD_MOBILEGL || '0' }}` 放进 run:，
          # 那样仍会在 workflow 编译期求值 vars。
          BUILD_MOBILEGL: ${{ vars.BUILD_MOBILEGL }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0
          export BUILD_MOBILEGL="${BUILD_MOBILEGL:-0}"

          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}

            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}.ipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        if: matrix.platform_name == 'ios' && success()
        uses: actions/upload-artifact@v4
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM

      # 把产物发布到固定的 nightly release：artifact 下载链接只有 10 分钟有效，
      # release asset 链接长期固定，便于挂代理/镜像加速（国内直连 GitHub 很慢）。
      # 每次先删除同名 release，保证始终只有一个 nightly、链接地址不变。
      - name: Publish nightly release
        if: matrix.platform_name == 'ios' && success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/sdl3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="nightly-sdl3"
          SHORT=$(git rev-parse --short HEAD)
          IPA=$(ls artifacts/com.air-devs.air-*-ios.ipa 2>/dev/null | head -1 || true)
          TIPA=$(ls artifacts/com.air-devs.air-*-ios-trollstore.tipa 2>/dev/null | head -1 || true)
          if [ -z "$IPA" ]; then
            echo "No ipa under artifacts/, skip release"
            exit 0
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          ASSETS=("$IPA")
          if [ -n "$TIPA" ]; then ASSETS+=("$TIPA"); fi
          gh release create "$TAG" \
            --prerelease \
            --title "Nightly (SDL3) @ ${SHORT}" \
            --notes "自动构建：${{ github.ref_name }} @ ${SHORT}。链接长期固定，可用镜像加速下载。" \
            "${ASSETS[@]}"
